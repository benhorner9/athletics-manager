name: Apply Career Identity Retirement Span Fix

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/apply-career-identity-retirement-span-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Clamp competitive career at retirement
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/career-identity-v2.js')
          s=p.read_text()
          old="if(a?.retired&&a.retirement?.season)return Math.max(last,num(a.retirement.season));"
          new="if(a?.retired&&a.retirement?.season)return num(a.retirement.season);"
          if old not in s: raise SystemExit('retirement span target missing')
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/career-identity-v2.js
          node tools/career-identity-v2-regression.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/career-identity-v2.js
          git commit -m "fix: stop athlete career span at retirement"
          git push origin HEAD:dev
