name: UI Regression Gate

# Live Event Broadcast V4.4 jumps phase is validated by this gate.
on:
  push:
    branches: [main]
    paths:
      - 'game.html'
      - 'scripts/**'
      - 'styles/**'
      - 'tools/static-regression.mjs'
      - 'tools/runtime-smoke.mjs'
      - '.github/workflows/ui-regression.yml'
  pull_request:
    paths:
      - 'game.html'
      - 'scripts/**'
      - 'styles/**'
      - 'tools/static-regression.mjs'
      - 'tools/runtime-smoke.mjs'
      - '.github/workflows/ui-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate UI asset graph and migration order
        run: node tools/static-regression.mjs
      - name: Validate Live Event Broadcast V4.4
        run: |
          node --check scripts/live-event-broadcast-v4.js
          grep -q 'function distanceGroups(c,state)' scripts/live-event-broadcast-v4.js
          grep -q 'function distanceCameraTarget(c,state)' scripts/live-event-broadcast-v4.js
          grep -q 'function distanceMoment(c)' scripts/live-event-broadcast-v4.js
          grep -q 'function distanceLeadComment(c,state)' scripts/live-event-broadcast-v4.js
          grep -q 'function fieldRoundInfo(c,q=c.seq\[c.i\]' scripts/live-event-broadcast-v4.js
          grep -q 'function fieldPreAttemptSpeech(c,q)' scripts/live-event-broadcast-v4.js
          grep -q 'function fieldBestMarkers(c,family)' scripts/live-event-broadcast-v4.js
          grep -q 'function horizontalJumpScale(d)' scripts/live-event-broadcast-v4.js
          grep -q 'function horizontalJumpPhase(c,p)' scripts/live-event-broadcast-v4.js
          grep -q 'function highJumpAttemptState(c,q)' scripts/live-event-broadcast-v4.js
          grep -q 'function highJumpSvg(c,q,p)' scripts/live-event-broadcast-v4.js
          grep -q "version:'4.4.0'" scripts/live-event-broadcast-v4.js
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find scripts -type f -name '*.js' -print0)
      - name: Install runtime smoke dependency
        run: npm install --no-save --no-package-lock jsdom@26
      - name: Execute browserless runtime smoke
        run: node tools/runtime-smoke.mjs
