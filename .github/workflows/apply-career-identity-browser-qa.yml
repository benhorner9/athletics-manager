name: Apply Career Identity Browser QA

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/apply-career-identity-browser-qa.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Add My Profile and athlete-history browser coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('tools/browser-qa.mjs')
          s=p.read_text()
          marker='\nfor(const scenario of scenarios){\n'
          if marker not in s:
              raise SystemExit('browser QA loop marker missing')
          fn=base64.b64decode('').decode()
          if 'async function inspectCareerIdentity' not in s:
              s=s.replace(marker,'\n'+fn+marker,1)
          old="  for(const [route,selector] of scenario.routes){\n   console.log(`[browser-qa] ${scenario.name} → ${route}`);\n   await inspectRoute(page,scenario,route,selector);\n  }\n  if(pageErrors.length)"
          new="  for(const [route,selector] of scenario.routes){\n   console.log(`[browser-qa] ${scenario.name} → ${route}`);\n   await inspectRoute(page,scenario,route,selector);\n  }\n  await inspectCareerIdentity(page,scenario);\n  if(pageErrors.length)"
          if old not in s:
              raise SystemExit('browser QA scenario insertion target missing')
          s=s.replace(old,new,1)
          old="console.log('✓ National Pool rating elements remained inside their cells');"
          new=old+"\nconsole.log('✓ Career Identity manager tabs, athlete history and return navigation passed across browser scenarios');"
          if new not in s:
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check tools/browser-qa.mjs
      - name: Commit browser QA coverage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/browser-qa.mjs
          git commit -m "test: cover career identity in real browsers"
          git push origin HEAD:dev
