name: Deploy Athletics Manager Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: athletics-manager-dev-deploy
  cancel-in-progress: true

jobs:
  qa:
    name: Automated QA before Dev Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out dev build
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install QA dependencies
        run: npm install --no-save --no-package-lock jsdom@26 playwright@1.55.0

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Publish deterministic QA status
        if: github.event_name != 'pull_request'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          AM_PIPELINE_STATE: running
          AM_PIPELINE_STAGE: deterministic
          AM_PIPELINE_LABEL: Tests and 16-week career soak are running
        run: bash tools/publish-dev-pipeline-status.sh

      - name: Run deterministic tests and 16-week career soak
        env:
          AM_AUDIT_WEEKS: '16'
        run: node tools/automated-qa.mjs soak

      - name: Publish browser QA status
        if: github.event_name != 'pull_request'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          AM_PIPELINE_STATE: running
          AM_PIPELINE_STAGE: browser
          AM_PIPELINE_LABEL: Desktop, iPad and iPhone browser QA is running
        run: bash tools/publish-dev-pipeline-status.sh

      - name: Run real-browser desktop, iPad and iPhone QA
        run: node tools/browser-qa.mjs

      - name: Publish QA passed status
        if: github.event_name != 'pull_request'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          AM_PIPELINE_STATE: passed
          AM_PIPELINE_STAGE: qa
          AM_PIPELINE_LABEL: All QA gates passed; deployment is next
        run: bash tools/publish-dev-pipeline-status.sh

      - name: Publish QA failed status
        if: failure() && github.event_name != 'pull_request'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          AM_PIPELINE_STATE: failed
          AM_PIPELINE_STAGE: qa
          AM_PIPELINE_LABEL: QA failed; this candidate was not deployed
        run: bash tools/publish-dev-pipeline-status.sh

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athletics-manager-dev-qa-${{ github.run_id }}
          path: .qa-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy Dev via FTPS
    if: github.event_name != 'pull_request'
    needs: qa
    runs-on: ubuntu-latest

    steps:
      - name: Check out dev build
        uses: actions/checkout@v4

      - name: Publish deploying status
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          AM_PIPELINE_STATE: deploying
          AM_PIPELINE_STAGE: deploy
          AM_PIPELINE_LABEL: QA passed; uploading the new dev build
        run: bash tools/publish-dev-pipeline-status.sh

      - name: Validate Live Event engines
        run: |
          node --check scripts/live-event-engine-v3.js
          node --check scripts/live-event-broadcast-v4.js

      - name: Verify legacy renderers are not active
        run: |
          ! grep -Eq 'event-2d|track-race-core|track-live-scoreboard|field-dot-playback|field-scoreboard-authority|scoreboard-instance-ownership|live-event-engine-v2' game.html
          ! grep -q '<ellipse' scripts/live-event-engine-v3.js
          grep -q 'scripts/live-event-broadcast-v4.js' game.html
          grep -q 'styles/live-event-broadcast-v4.css' game.html

      - name: Run repository regression checks
        shell: bash
        run: |
          set -euo pipefail
          node tools/repository-hygiene.mjs
          node tools/static-regression.mjs
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find scripts -type f -name '*.js' -print0)

      - name: Inject dev runtime guards and build status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re

          path = Path('game.html')
          html = path.read_text(encoding='utf-8')
          build = os.environ['GITHUB_SHA'][:8]

          for asset in (
              'competition-journey-route-guard-v1.js',
              'ui-cutover-v1.js',
          ):
              html = re.sub(
                  rf'scripts/{re.escape(asset)}\?v=[^"\']+',
                  f'scripts/{asset}?v={build}',
                  html,
              )

          storage_marker = '<!-- AM_DEV_STORAGE_ISOLATION -->'
          storage_tag = f'{storage_marker}\n<script src="scripts/dev/dev-storage-isolation-v1.js?v={build}"></script>'
          if storage_marker not in html:
              needle = '<script src="scripts/save-codec.js'
              if needle not in html:
                  raise SystemExit('Could not locate save-codec script for dev storage guard injection')
              html = html.replace(needle, storage_tag + '\n' + needle, 1)

          marker = '<!-- AM_DEV_BUILD_STATUS -->'
          tag = f'{marker}\n<script src="scripts/dev/dev-build-status-v1.js?v={build}"></script>'
          if marker in html:
              before, _, tail = html.partition(marker)
              tail = tail.split('\n', 2)
              html = before + tag + ('\n' + tail[2] if len(tail) > 2 else '')
          else:
              html = html.replace('</body>', tag + '\n</body>')

          if html.find('dev-storage-isolation-v1.js') > html.find('scripts/game.js'):
              raise SystemExit('Dev storage isolation must load before game.js')
          path.write_text(html, encoding='utf-8')

          index_path = Path('index.html')
          index_html = index_path.read_text(encoding='utf-8')
          index_html = index_html.replace(
              "localStorage.getItem('rto_full_game_v1')",
              "localStorage.getItem('rto_full_game_dev_v1')",
          )
          if "localStorage.getItem('rto_full_game_dev_v1')" not in index_html:
              raise SystemExit('Dev index save-key rewrite did not apply')
          index_path.write_text(index_html, encoding='utf-8')
          PY

      - name: Deploy dev build to hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: ${{ secrets.FTP_PORT || 21 }}
          server-dir: ./dev/
          local-dir: ./
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/docs/**
            **/.qa-artifacts/**

      - name: Publish live dev build marker
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail
          PORT="${FTP_PORT:-21}"
          BASE="ftp://${FTP_SERVER}:${PORT}/dev"
          mkdir -p .deploy-status

          curl --insecure --silent --show-error --ssl-reqd \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            "$BASE/dev-build-history.json" \
            -o .deploy-status/previous-history.json || true

          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import json, os, subprocess

          sha = os.environ['GITHUB_SHA']
          title = subprocess.check_output(['git','log','-1','--pretty=%s'], text=True).strip()
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          entry = {
              'channel': 'dev',
              'sha': sha,
              'shortSha': sha[:8],
              'title': title,
              'deployedAt': now,
              'runId': os.environ.get('GITHUB_RUN_ID',''),
              'runNumber': os.environ.get('GITHUB_RUN_NUMBER','')
          }

          previous = []
          p = Path('.deploy-status/previous-history.json')
          if p.exists():
              try:
                  raw = json.loads(p.read_text(encoding='utf-8'))
                  previous = raw if isinstance(raw, list) else raw.get('history', [])
              except Exception:
                  previous = []

          history = [entry]
          for item in previous:
              if not isinstance(item, dict) or item.get('sha') == sha:
                  continue
              history.append(item)
              if len(history) >= 10:
                  break

          Path('.deploy-status/dev-build.json').write_text(json.dumps(entry, indent=2) + '\n', encoding='utf-8')
          Path('.deploy-status/dev-build-history.json').write_text(json.dumps(history, indent=2) + '\n', encoding='utf-8')
          runtime = 'window.__ATHLETICS_DEV_RUNTIME_BUILD=' + json.dumps(entry, separators=(',',':')) + ';\n'
          Path('.deploy-status/dev-runtime-build.js').write_text(runtime, encoding='utf-8')
          PY

          curl --insecure --fail --silent --show-error --ssl-reqd --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T .deploy-status/dev-build-history.json \
            "$BASE/dev-build-history.json"

          curl --insecure --fail --silent --show-error --ssl-reqd --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T .deploy-status/dev-runtime-build.js \
            "$BASE/scripts/dev/dev-runtime-build.js"

          curl --insecure --fail --silent --show-error --ssl-reqd --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            -T .deploy-status/dev-build.json \
            "$BASE/dev-build.json"

      - name: Publish live pipeline status
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          AM_PIPELINE_STATE: live
          AM_PIPELINE_STAGE: complete
          AM_PIPELINE_LABEL: New dev build is live
        run: bash tools/publish-dev-pipeline-status.sh

      - name: Publish deployment failed status
        if: failure()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          AM_PIPELINE_STATE: failed
          AM_PIPELINE_STAGE: deploy
          AM_PIPELINE_LABEL: Deployment failed; previous dev build remains authoritative
        run: bash tools/publish-dev-pipeline-status.sh
