name: Apply Career Identity Syntax Repair

on:
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/apply-career-identity-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Repair retirement mail function boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/career-identity-v2.js')
          s=p.read_text()
          old='''<p><strong>First recorded selection</strong><br>${esc(first)}</p>`}\n}\n\nfunction programmeStats'''
          new='''<p><strong>First recorded selection</strong><br>${esc(first)}</p>`;\n}\n\nfunction programmeStats'''
          if old not in s:
              raise SystemExit('Expected Career Identity V2 syntax target not found')
          p.write_text(s.replace(old,new,1))
          PY
          node --check scripts/career-identity-v2.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/career-identity-v2.js
          git commit -m "fix: repair career identity retirement summary syntax"
          git push origin HEAD:dev
