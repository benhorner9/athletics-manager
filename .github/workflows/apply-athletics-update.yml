name: Apply Athletics Manager update

on:
  push:
    paths:
      - '.am-update/**'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged Athletics Manager update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          parts = sorted(Path('.am-update').glob('part*.b64'))
          if len(parts) < 2:
              raise SystemExit('Waiting for all update payload parts.')
          payload = ''.join(p.read_text().strip() for p in parts)
          script = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          Path('/tmp/apply_update.py').write_text(script, encoding='utf-8')
          exec(compile(script, '/tmp/apply_update.py', 'exec'))
          PY

      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          Path('/tmp/check.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/check.js

      - name: Commit updated game
        run: |
          rm -rf .am-update
          git config user.name 'ChatGPT Athletics Manager'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html .am-update
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add first-pass 3D event broadcast'
          git push
