name: Apply Athletics Manager update

on:
  push:
    paths:
      - '.am-update/READY'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install update tooling
        run: python3 -m pip install --user --disable-pip-version-check Pillow

      - name: Apply staged Athletics Manager update
        run: |
          if [ -f .am-update/apply.py ]; then
            python3 .am-update/apply.py
          else
            python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          parts = sorted(Path('.am-update').glob('part*.b64'))
          if not parts:
              raise SystemExit('No staged update payload found.')
          payload = ''.join(p.read_text().strip() for p in parts)
          script = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          Path('/tmp/apply_update.py').write_text(script, encoding='utf-8')
          exec(compile(script, '/tmp/apply_update.py', 'exec'))
          PY
          fi

      - name: Enforce staged-migration safety
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'styles/game.css' game.html; then
            echo 'Legacy cutover blocked: styles/game.css must remain until migration QA is explicitly completed.' >&2
            exit 1
          fi
          if ! grep -q 'scripts/game.js' game.html; then
            echo 'Legacy cutover blocked: scripts/game.js must remain until migration QA is explicitly completed.' >&2
            exit 1
          fi
          if [ -f tools/static-regression.mjs ]; then
            node tools/static-regression.mjs
          fi

      - name: Check JavaScript syntax
        run: |
          if compgen -G 'scripts/*.js' > /dev/null; then
            for file in scripts/*.js; do
              echo "Checking $file"
              node --check "$file"
            done
          else
            python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          Path('/tmp/check.js').write_text('\n\n'.join(scripts), encoding='utf-8')
          PY
            node --check /tmp/check.js
          fi

      - name: Commit updated game
        run: |
          MESSAGE="$(cat .am-update/COMMIT_MESSAGE 2>/dev/null || echo 'Apply Athletics Manager update')"
          if [ -f .am-update/NO_WORKFLOW_CHANGES ]; then
            git restore -- .github/workflows
          fi
          rm -rf .am-update
          git config user.name 'ChatGPT Athletics Manager'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "$MESSAGE"
          git push
