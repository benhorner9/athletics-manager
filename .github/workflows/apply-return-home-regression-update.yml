name: Apply Return Home Regression Contract Update

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-return-home-regression-update.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Update stale competition exit regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/dev-stability-regression.mjs')
          s=p.read_text(encoding='utf-8')
          old_event="  const e={id:'meet',week:5,results:{W100:[]},completed:false};"
          new_event="  const e={id:'meet',week:5,results:{},completed:false};"
          if old_event not in s: raise SystemExit('stale event fixture not found')
          s=s.replace(old_event,new_event,1)
          anchor="  assert.equal(f.w.document.getElementById('v3back').textContent,'‹');"
          inserted=anchor+"\n  e.results.W100=[];f.w.decorateLive(e,'W100');\n  assert.equal(f.w.document.getElementById('v3day').textContent,'RETURN HOME');\n  f.w.document.getElementById('v3day').click();\n  assert.equal(JSON.stringify(f.w.opened[1]),'[\"meet\",\"home\"]');\n  assert.equal(e.completed,false,'returning home after one result must not complete the whole meeting');"
          if anchor not in s: raise SystemExit('stability anchor not found')
          s=s.replace(anchor,inserted,1)
          old_results="  assert.equal(JSON.stringify(f.w.opened[1]),'[\"meet\",\"results\"]');"
          new_results="  assert.equal(JSON.stringify(f.w.opened[2]),'[\"meet\",\"results\"]');"
          if old_results not in s: raise SystemExit('results index assertion not found')
          s=s.replace(old_results,new_results,1)
          old_home="  assert.equal(JSON.stringify(f.w.opened[2]),'[\"meet\",\"home\"]');"
          new_home="  assert.equal(JSON.stringify(f.w.opened[3]),'[\"meet\",\"home\"]');"
          if old_home not in s: raise SystemExit('home index assertion not found')
          s=s.replace(old_home,new_home,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
      - name: Commit regression contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/dev-stability-regression.mjs
          git commit -m "test: align event exit stability contract"
          git push origin HEAD:dev
