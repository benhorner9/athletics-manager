name: Apply Live Scoreboard Fill Fix

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/apply-scoreboard-fill-fix.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply scoreboard width fix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='styles/live-event-shell-v5.css';
          let css=fs.readFileSync(path,'utf8');
          const marker='/* V5.2 scoreboard width fill */';
          if(!css.includes(marker)){
            css += `\n\n${marker}\n#competition .lv5event #liveScoreboard .v3board-list{width:100%!important;max-width:none!important;align-self:stretch!important;justify-self:stretch!important;box-sizing:border-box!important}\n#competition .lv5event #liveScoreboard .lv4-board-row{width:100%!important;max-width:none!important;box-sizing:border-box!important;align-self:stretch!important}\n#competition .lv5event #liveScoreboard .lv4-board-row>span{justify-self:end!important;text-align:right!important}\n`;
            fs.writeFileSync(path,css);
          }
          NODE
      - name: Remove one-shot workflow
        run: git rm .github/workflows/apply-scoreboard-fill-fix.yml
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'athletics-manager-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add styles/live-event-shell-v5.css
          if git diff --cached --quiet; then
            echo 'No CSS change required.'
          fi
          git commit -m 'fix: make live scoreboard rows fill standings panel'
          git push origin HEAD:dev
